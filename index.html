<!DOCTYPE html>
<html lang="pt-BR">

<head>

  <meta charset="UTF-8" />

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Salatiel Levi</title>

  <!-- FONT -->

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet"
  >

  <!-- CSS -->

  <link rel="stylesheet" href="style.css">

</head>

<body>

  <!-- HEADER -->

  <header class="hero">

    <div class="slider">

      <!-- PLACEHOLDER IMAGES -->

      <div
        class="slide"
        style="background-image:url('foto2.png')">
      </div>

      <div
        class="slide"
        style="background-image:url('foto2.png')">
      </div>

      <div
        class="slide"
        style="background-image:url('foto2.png')">
      </div>

    </div>

    <div class="overlay"></div>

    <div class="hero-content">

      <h1 class="hero-title">

        <span class="letter-s">
          S
        </span>

        <span class="rest-name">
        alat
        </span>


      </h1>

    </div>

  </header>

  <!-- MAIN -->

  <main class="container">

    <section class="content">

      <!-- TEXT -->

      <div class="text-area">

        <h2
          class="typing-text"
          id="typing">
        </h2>

        <!-- LINKS -->

        <div class="socials">

          <a
            href="https://t.me/salatbanana"
            class="social-link"
          >
            Telegram ↗
          </a>

<a href="#">
  <span class="social-link email-copy" id="emailCopy">
    Email ↗
  </span>
</a>

<div class="copy-toast" id="copyToast">
  Email copiado
</div>


        </div>

      </div>

      <!-- IMAGE -->

      <div class="image-box">

        <div class="placeholder">
          <img src="pfp222.jpg" alt="">
        </div>

      </div>

    </section>

  </main>

  <!-- FOOTER -->

  <footer>
    © 2026 — Salatiel Levi
  </footer>

  <!-- AUDIO -->

  <audio autoplay loop id="bg-music">
    <source src="audio.mp3" type="audio/mp3">
  </audio>

  <!-- JS -->

  <script>
    /* =========================
   COPY EMAIL
========================= */

const emailBtn = document.getElementById("emailCopy");
const toast = document.getElementById("copyToast");

const email = "levisalatiel@proton.me";

emailBtn.addEventListener("click", () => {

  navigator.clipboard.writeText(email);

  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 1800);

});

    /* =========================
       TYPING TEXT
    ========================== */

    const typing = document.getElementById("typing");

    const firstText =
    "Tenho evitado os turbilhões de estímulos das redes sociais e suas consequências.";

    const secondText =
    " Me contate em uma das alternativas abaixo.";

    let index = 0;

    function typeFirst(){

      if(index < firstText.length){

        typing.innerHTML += firstText.charAt(index);

        index++;

        setTimeout(typeFirst, 28);

      } else {

        setTimeout(typeSecond, 300);

      }

    }

    let secondIndex = 0;

    function typeSecond(){

      if(secondIndex === 0){

        typing.innerHTML +=
        '<span class="red-text"></span>';
      }

      const redText =
      document.querySelector(".red-text");

      if(secondIndex < secondText.length){

        redText.innerHTML +=
        secondText.charAt(secondIndex);

        secondIndex++;

        setTimeout(typeSecond, 28);

      }

    }

    window.addEventListener("load", () => {

      setTimeout(typeFirst, 1000);

    });

    /* =========================
       AUDIO FADE
    ========================== */

    const music = document.getElementById("bg-music");

    music.volume = 0;

    window.addEventListener("load", () => {

      let volume = 0;

      const fade = setInterval(() => {

        if(volume < 0.25){

          volume += 0.01;

          music.volume = volume;

        } else {

          clearInterval(fade);

        }

      }, 120);

    });

  </script>

</body>

</html>
